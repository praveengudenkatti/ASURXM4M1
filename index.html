body.light .topbar{background:rgba(241,245,249,0.92)}
body.light .side-panel{background:rgba(241,245,249,0.97)}
body.light .theme-card{box-shadow:0 24px 70px rgba(0,0,0,.15)}
body.light .join-btn{color:#fff}
body.light .fab-btn{box-shadow:0 4px 20px rgba(0,0,0,0.15),0 0 0 1px rgba(0,0,0,0.05)}

.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-grad{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 50% at 20% 10%, hsl(var(--primary-h),100%,50%,0.05) 0%, transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 90%, hsl(var(--primary-h),100%,50%,0.04) 0%, transparent 55%)}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(hsl(var(--primary-h),100%,50%,0.04) 1px,transparent 1px),
  linear-gradient(90deg,hsl(var(--primary-h),100%,50%,0.04) 1px,transparent 1px);
  background-size:52px 52px}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%}

.page{position:relative;z-index:10;min-height:100vh;padding:72px 16px 80px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,13,20,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2)}
body.light .topbar{background:rgba(241,245,249,0.9)}
.topbar-logo{display:flex;align-items:center;gap:8px}
.topbar-icon{width:32px;height:32px;border-radius:10px;background:hsl(var(--primary-h),100%,50%,0.12);border:1px solid hsl(var(--primary-h),100%,50%,0.25);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:.85rem}
.topbar-name{font-size:.8rem;font-weight:700;color:var(--fg);letter-spacing:.05em}
.topbar-sub{font-size:.6rem;color:var(--fg2)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;color:var(--fg2);font-size:.85rem;position:relative}
.topbar-btn:hover{background:hsl(var(--primary-h),100%,50%,0.1);border-color:hsl(var(--primary-h),100%,50%,0.3);color:var(--primary)}
.topbar-btn .btn-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:var(--fg2);opacity:0;transition:opacity .2s;pointer-events:none;background:var(--card);padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
.topbar-btn:hover .btn-label{opacity:1}

.badge-row{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;background:hsl(var(--primary-h),100%,50%,0.1);border:1px solid hsl(var(--primary-h),100%,50%,0.2);margin-bottom:16px}
.badge-row span{font-size:10px;font-weight:700;color:var(--primary);letter-spacing:.2em;text-transform:uppercase}

.main-title{font-size:clamp(2rem,8vw,3.2rem);font-weight:900;letter-spacing:-.02em;line-height:1;text-align:center;color:var(--fg);margin-bottom:10px}
.main-title .accent{background:linear-gradient(135deg,var(--primary),hsl(var(--primary-h),70%,80%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.9rem;color:var(--fg2);text-align:center;line-height:1.6;margin-bottom:24px;max-width:300px}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;width:100%}
.stat-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:18px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);transition:all .3s}
.stat-card:hover{border-color:hsl(var(--primary-h),100%,50%,0.3);transform:translateY(-2px);box-shadow:0 8px 24px hsl(var(--primary-h),100%,50%,0.08)}
.stat-icon{width:28px;height:28px;border-radius:8px;background:hsl(var(--primary-h),100%,50%,0.1);border:1px solid hsl(var(--primary-h),100%,50%,0.15);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:.75rem}
.stat-val{font-size:1.2rem;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
.stat-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--fg2)}

.search-wrap{position:relative;width:100%;margin-bottom:28px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg2);font-size:.85rem;pointer-events:none}
.search-input{width:100%;padding:13px 14px 13px 42px;border-radius:16px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);color:var(--fg);font-size:.875rem;font-family:var(--font);outline:none;transition:all .3s}
.search-input:focus{border-color:hsl(var(--primary-h),100%,50%,0.4);box-shadow:0 0 0 3px hsl(var(--primary-h),100%,50%,0.08)}
.search-input::placeholder{color:var(--fg2);opacity:.5}

.section-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;width:100%}
.section-row::before,.section-row::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--fg2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.section-title i{color:var(--primary);font-size:.7rem}

.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-bottom:28px}
@media(min-width:460px){.tools-grid{grid-template-columns:repeat(4,1fr)}}

.tool-card-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px 14px;border-radius:22px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid var(--border);text-decoration:none;color:var(--fg);transition:all .3s cubic-bezier(.23,1,.32,1);overflow:hidden;cursor:pointer}
.tool-card-item::after{content:"";position:absolute;top:0;inset-x:0;height:1px;background:linear-gradient(90deg,transparent,hsl(var(--primary-h),100%,50%,0.6),transparent);opacity:0;transition:opacity .3s}
.tool-card-item:hover{border-color:hsl(var(--primary-h),100%,50%,0.4);box-shadow:0 8px 30px hsl(var(--primary-h),100%,50%,0.15),0 0 0 1px hsl(var(--primary-h),100%,50%,0.1);transform:translateY(-5px)}
.tool-card-item:hover::after{opacity:1}
.tool-card-item:active{transform:translateY(-2px)}
.tool-img-wrap{width:60px;height:60px;border-radius:16px;overflow:hidden;border:1.5px solid var(--border);background:var(--card2);flex-shrink:0;transition:all .3s}
.tool-card-item:hover .tool-img-wrap{border-color:hsl(var(--primary-h),100%,50%,0.35);box-shadow:0 0 18px hsl(var(--primary-h),100%,50%,0.2)}
.tool-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.tool-card-item:hover .tool-img-wrap img{transform:scale(1.08)}
.tool-icon-wrap{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:hsl(var(--primary-h),100%,50%,0.1);border:1.5px solid hsl(var(--primary-h),100%,50%,0.2);font-size:1.6rem;color:var(--primary);transition:all .3s;flex-shrink:0}
.tool-card-item:hover .tool-icon-wrap{border-color:hsl(var(--primary-h),100%,50%,0.5);box-shadow:0 0 18px hsl(var(--primary-h),100%,50%,0.2)}
.tool-label-text{font-size:11.5px;font-weight:600;color:var(--fg2);text-align:center;line-height:1.3;transition:color .25s;width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tool-card-item:hover .tool-label-text{color:var(--fg)}

.join-btn{display:inline-flex;align-items:center;gap:10px;padding:15px 32px;background:var(--primary);color:#000;border-radius:50px;text-decoration:none;font-weight:700;font-family:var(--font);font-size:.9rem;margin:4px 0 28px;box-shadow:0 0 28px hsl(var(--primary-h),100%,50%,0.4);transition:all .3s;animation:pulsebtn 2.5s infinite}
@keyframes pulsebtn{0%{box-shadow:0 0 0 0 hsl(var(--primary-h),100%,50%,0.5)}70%{box-shadow:0 0 0 16px hsl(var(--primary-h),100%,50%,0)}100%{box-shadow:0 0 0 0 hsl(var(--primary-h),100%,50%,0)}}
.join-btn:hover{transform:scale(1.05);box-shadow:0 0 40px hsl(var(--primary-h),100%,50%,0.6)}

.footer-txt{font-size:.7rem;color:var(--fg2);opacity:.4;text-align:center;padding:8px 0 0;letter-spacing:.06em}

.lovable-badge{position:fixed;bottom:14px;left:12px;z-index:99;display:flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:50px;background:rgba(10,13,20,0.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);text-decoration:none;transition:all .3s;cursor:pointer;opacity:.6}
.lovable-badge:hover{opacity:1;border-color:hsl(var(--primary-h),100%,50%,0.3);box-shadow:0 2px 12px rgba(0,0,0,0.3)}
body.light .lovable-badge{background:rgba(255,255,255,0.75);border-color:rgba(0,0,0,0.06)}
.lovable-badge-icon{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff}
.lovable-badge-text{font-size:7px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}

.fab-row{position:fixed;bottom:20px;right:16px;z-index:99;display:flex;flex-direction:column;gap:10px;align-items:center}
.fab-btn{width:38px;height:38px;border-radius:50%;border:none;color:#fff;font-size:.9rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.1);transition:all .3s;display:flex;align-items:center;justify-content:center}
.fab-btn:hover{transform:scale(1.12) translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.fab-settings{background:linear-gradient(135deg,hsl(var(--primary-h),100%,40%),hsl(var(--primary-h),80%,60%));animation:settingsPulse 3s infinite}
.fab-whatsapp{background:linear-gradient(135deg,#25D366,#128C7E);animation:waPulse 2.5s infinite}
@keyframes waPulse{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,0.4)}50%{box-shadow:0 4px 16px rgba(37,211,102,0.5)}}
@keyframes settingsPulse{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,0.4)}50%{box-shadow:0 4px 16px hsl(var(--primary-h),100%,50%,0.5)}}

.ai-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(10px)}
.ai-modal.open{display:flex}
.ai-sheet{width:100%;max-width:600px;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid var(--border);border-left:1px solid var(--border);border-right:1px solid var(--border);display:flex;flex-direction:column;max-height:80vh}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border2)}
.ai-head-left{display:flex;align-items:center;gap:10px}
.ai-head-icon{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,hsl(270,100%,55%,0.2),hsl(var(--primary-h),100%,50%,0.1));border:1px solid hsl(270,100%,55%,0.3);display:flex;align-items:center;justify-content:center;font-size:1rem}
.ai-head-title{font-weight:700;font-size:.9rem;color:var(--fg)}
.ai-head-sub{font-size:10px;color:var(--fg2)}
.ai-close{background:var(--border2);border:1px solid var(--border);color:var(--fg2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ai-close:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.ai-chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ai-msg{padding:11px 14px;border-radius:14px;font-size:.85rem;line-height:1.5;max-width:88%}
.ai-msg.bot{background:var(--card2);border:1px solid var(--border);color:var(--fg2);align-self:flex-start}
.ai-msg.user{background:hsl(var(--primary-h),100%,50%,0.15);border:1px solid hsl(var(--primary-h),100%,50%,0.2);color:var(--fg);align-self:flex-end}
.ai-input-row{padding:12px 14px;border-top:1px solid var(--border2);display:flex;gap:10px}
.ai-input{flex:1;padding:11px 14px;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--fg);font-size:.875rem;font-family:var(--font);outline:none;transition:border-color .3s}
.ai-input:focus{border-color:hsl(var(--primary-h),100%,50%,0.4)}
.ai-input::placeholder{color:var(--fg2);opacity:.5}
.ai-send{padding:11px 18px;background:var(--primary);border:none;border-radius:12px;color:#000;font-weight:700;cursor:pointer;font-size:.85rem;font-family:var(--font);transition:all .25s;white-space:nowrap}
.ai-send:hover{opacity:.85;transform:scale(1.03)}

.side-panel{position:fixed;top:0;right:0;height:100%;width:270px;z-index:200;transform:translateX(100%);transition:transform .4s cubic-bezier(.23,1,.32,1);background:rgba(10,13,20,0.97);backdrop-filter:blur(30px);border-left:1px solid var(--border);display:flex;flex-direction:column}
.side-panel.open{transform:translateX(0)}
body.light .side-panel{background:rgba(241,245,249,0.97)}
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.panel-overlay.open{opacity:1;pointer-events:all}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid var(--border2)}
.panel-title{font-size:.875rem;font-weight:700;color:var(--fg)}
.panel-close{width:30px;height:30px;border-radius:8px;background:var(--border2);border:1px solid var(--border);color:var(--fg2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:1rem}
.panel-close:hover{transform:rotate(90deg);color:var(--fg)}
.panel-section{padding:14px 14px 6px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--fg2);opacity:.6}
.panel-items{padding:0 10px;display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.panel-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;transition:all .25s;text-decoration:none;color:var(--fg2);font-size:.85rem;font-weight:500;font-family:var(--font)}
.panel-item:hover,.panel-item.active{background:hsl(var(--primary-h),100%,50%,0.08);border-color:hsl(var(--primary-h),100%,50%,0.15);color:var(--fg)}
.panel-item-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;border:1px solid}

.theme-modal{position:fixed;inset:0;z-index:960;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);padding:16px}
.theme-modal.open{display:flex}
.theme-card{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.theme-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border2)}
.theme-title{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px;color:var(--fg)}
.theme-close{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--fg2);cursor:pointer;font-size:1rem;transition:all .2s}
.theme-close:hover{color:var(--fg);border-color:hsl(var(--primary-h) 100% 50% / 0.3)}
.theme-mode{padding:16px 18px;border-bottom:1px solid var(--border2)}
.theme-subtitle{font-size:1rem;font-weight:600;color:var(--fg);margin-bottom:12px}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode-btn{padding:13px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--border);color:var(--fg2);font-family:var(--font);font-size:1.15rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .25s}
.mode-btn.active{border-color:hsl(var(--primary-h) 100% 50% / 0.6);color:var(--primary);background:hsl(var(--primary-h) 100% 50% / 0.1)}
.theme-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--border2)}
.theme-tab{padding:14px 12px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--fg2);font-family:var(--font);font-size:1.15rem;font-weight:600;cursor:pointer;display:flex;justify-content:center;gap:8px;transition:all .25s}
.theme-tab.active{color:var(--primary);border-bottom-color:var(--primary);background:hsl(var(--primary-h) 100% 50% / 0.06)}
.theme-body{padding:16px 18px 20px}
.theme-section{display:none}
.theme-section.active{display:block}
.theme-colors-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.theme-color-chip{padding:10px 8px;border-radius:14px;border:1px solid var(--border);background:var(--card2);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--font);transition:all .25s;min-height:88px}
.theme-color-chip .chip-emoji{font-size:1.25rem;line-height:1}
.theme-color-chip .chip-name{font-size:.8rem;font-weight:600;text-align:center;line-height:1.2}
.theme-color-chip.active{border-color:hsl(var(--primary-h) 100% 50% / 0.65);background:hsl(var(--primary-h) 100% 50% / 0.1);box-shadow:0 0 0 1px hsl(var(--primary-h) 100% 50% / 0.2)}
.theme-fonts-list{display:flex;flex-direction:column;gap:10px}
.theme-font-btn{padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--fg2);font-size:.95rem;cursor:pointer;text-align:left;transition:all .25s}
.theme-font-btn.active{border-color:hsl(var(--primary-h) 100% 50% / 0.6);color:var(--primary);background:hsl(var(--primary-h) 100% 50% / 0.08)}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:hsl(var(--primary-h),100%,50%,0.25);border-radius:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp .5s ease-out both}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}.stagger-4{animation-delay:.2s}.stagger-5{animation-delay:.25s}
</style>
</head>
<body>
${Fi}${Di}

<div class="bg-layer">
  <div class="bg-grad"></div>
  <div class="bg-grid"></div>
  <canvas id="bgCanvas"></canvas>
</div>
${Rs}

<div class="topbar">
  <div class="topbar-logo">
    ${I?`<img src="${I}" alt="DP" style="width:32px;height:32px;border-radius:10px;object-fit:cover;border:1px solid hsl(var(--primary-h),100%,50%,0.25)">`:'<div class="topbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg></div>'}
    <div>
      <div class="topbar-name">${e}</div>
      <div class="topbar-sub">Premium Toolkit</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="openThemeSettings()" title="Theme Settings">
      <i class="fas fa-moon" id="themeIcon"></i>
      <span class="btn-label" id="themeLabel">Theme Settings</span>
    </button>
    <button class="topbar-btn" onclick="togglePanel()" title="Menu">
      <i class="fas fa-bars"></i>
      <span class="btn-label">Menu</span>
    </button>
  </div>
</div>

<div class="panel-overlay" id="overlay" onclick="togglePanel()"></div>

<div class="side-panel" id="sidePanel">
  <div class="panel-head">
    <div style="display:flex;align-items:center;gap:9px">
      <div class="topbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg></div>
      <div><div class="panel-title">${e}</div><div style="font-size:10px;color:var(--fg2)">Premium Toolkit</div></div>
    </div>
    <button class="panel-close" onclick="togglePanel()">✕</button>
  </div>
  <div class="panel-section">Navigation</div>
  <div class="panel-items">
    <a href="#" class="panel-item" onclick="togglePanel()">

    root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f87171;font-family:monospace;padding:24px;text-align:center;white-space:pre-wrap;">Error: ' +
      (fatalErr && fatalErr.message ? fatalErr.message : String(fatalErr)) + '</div>';
  }
}

</script>
</body></html>
